
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIZ MUSIC</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  padding-bottom: 110px;
}

header {
  padding: 22px;
  background: #181818;
}

header h1 {
  color: #1ed760;
  margin: 0;
  letter-spacing: 2px;
}

header p {
  color: #aaa;
}

main {
  padding: 20px;
}

h2 {
  margin-top: 28px;
}

.search {
  width: 100%;
  padding: 14px;
  border-radius: 25px;
  border: none;
  background: #292929;
  color: white;
  font-size: 16px;
}

.upload {
  background: #1ed760;
  color: black;
  padding: 13px;
  border: none;
  border-radius: 25px;
  font-weight: bold;
  margin-top: 15px;
}

.songs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.song {
  background: #202020;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
  min-width: 0;
}

.cover {
  aspect-ratio: 1;
  background: linear-gradient(135deg, #1ed760, #163b26);
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 42px;
  margin-bottom: 10px;
}

.song p {
  margin: 5px 0;
  overflow-wrap: anywhere;
}

.artist {
  color: #aaa;
  font-size: 13px;
}

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #181818;
  border-top: 1px solid #333;
  padding: 12px 18px;
  text-align: center;
}

#now {
  font-weight: bold;
}

.controls button {
  background: none;
  color: white;
  border: none;
  font-size: 25px;
  padding: 8px 15px;
}

#play {
  color: #1ed760;
}

input[type=range] {
  accent-color: #1ed760;
  width: 100%;
}

footer {
  color: #777;
  text-align: center;
  padding: 25px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>RIZ MUSIC ♪</h1>
  <p>Your music, your world.</p>
</header>

<main>

  <input
    class="search"
    id="search"
    placeholder="Cari musik..."
  >

  <h2>Selamat datang 🎧</h2>
  <p style="color:#aaa">
    Temukan musik favoritmu.
  </p>

  <label class="upload">
    + Tambahkan Musik
    <input
      type="file"
      id="files"
      accept="audio/*"
      multiple
      hidden
    >
  </label>

  <h2>Playlist kamu</h2>

  <div class="songs" id="songs">
  </div>

</main>

<div class="player">
  <div id="now">Belum ada lagu diputar</div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    max="100"
  >

  <div class="controls">
    <button onclick="previous()">⏮</button>
    <button id="play" onclick="togglePlay()">▶</button>
    <button onclick="next()">⏭</button>
  </div>

  <input
    type="range"
    id="volume"
    min="0"
    max="1"
    step="0.01"
    value="0.7"
  >
</div>

<audio id="audio"></audio>

<script>
const audio = document.getElementById("audio");
const songs = document.getElementById("songs");
const now = document.getElementById("now");
const play = document.getElementById("play");
const progress = document.getElementById("progress");

let playlist = [];
let current = 0;

document.getElementById("files").onchange = function() {
  const files = Array.from(this.files);

  files.forEach(file => {
    playlist.push({
      name: file.name,
      url: URL.createObjectURL(file)
    });
  });

  renderSongs();
};

function renderSongs() {
  songs.innerHTML = "";

  playlist.forEach((song, index) => {
    const card = document.createElement("div");
    card.className = "song";

    card.innerHTML = `
      <div class="cover">♪</div>
      <p></p>
      <div class="artist">Musik lokal</div>
    `;

    card.querySelector("p").textContent = song.name;
    card.onclick = () => loadSong(index);

    songs.appendChild(card);
  });
}

function loadSong(index) {
  if (!playlist.length) return;

  current = index;
  audio.src = playlist[current].url;
  now.textContent = playlist[current].name;

  audio.play();
  play.textContent = "⏸";
}

function togglePlay() {
  if (!playlist.length) {
    alert("Tambahkan lagu terlebih dahulu!");
    return;
  }

  if (audio.paused) {
    if (!audio.src) {
      loadSong(current);
    } else {
      audio.play();
    }
    play.textContent = "⏸";
  } else {
    audio.pause();
    play.textContent = "▶";
  }
}

function next() {
  if (!playlist.length) return;
  loadSong((current + 1) % playlist.length);
}

function previous() {
  if (!playlist.length) return;
  loadSong(
    (current - 1 + playlist.length) % playlist.length
  );
}

audio.ontimeupdate = () => {
  if (audio.duration) {
    progress.value =
      (audio.currentTime / audio.duration) * 100;
  }
};

progress.oninput = () => {
  if (audio.duration) {
    audio.currentTime =
      (progress.value / 100) * audio.duration;
  }
};

audio.onended = next;

document.getElementById("volume").oninput = function() {
  audio.volume = this.value;
};

audio.volume = 0.7;

document.getElementById("search").oninput = function() {
  const query = this.value.toLowerCase();

  document.querySelectorAll(".song").forEach((card, i) => {
    card.style.display =
      playlist[i].name.toLowerCase().includes(query)
        ? ""
        : "none";
  });
};
</script>

<footer>
  RIZ MUSIC © 2026
</footer>

</body>
</html>
+
